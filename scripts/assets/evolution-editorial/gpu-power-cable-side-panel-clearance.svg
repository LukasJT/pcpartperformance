<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc"><title id="title">Body fit is only one boundary</title><desc id="desc">Conceptual card, power connector and side-panel boundary show that cable exit adds space beyond the GPU body. Original schematic; not a manufacturer wiring diagram, product measurement or benchmark.</desc><rect width="960" height="520" rx="24" fill="#f6f9fe"/><g font-family="system-ui,Segoe UI,sans-serif"><text x="45" y="55" fill="#152c45" font-size="31" font-weight="750" text-anchor="start"><tspan x="45" dy="0">Body fit is only one boundary</tspan></text><rect x="70" y="190" width="570" height="130" rx="16" fill="#edf4fd" stroke="#a9c0d9" stroke-width="2"/><text x="280" y="260" fill="#152c45" font-size="30" font-weight="650" text-anchor="middle"><tspan x="280" dy="0">GPU body</tspan></text><circle cx="160" cy="254" r="40" fill="#ffffff" stroke="#215edb" stroke-width="3"/><circle cx="400" cy="254" r="40" fill="#ffffff" stroke="#215edb" stroke-width="3"/><rect x="608" y="211" width="75" height="84" rx="16" fill="#ffffff" stroke="#215edb" stroke-width="2"/><path d="M683 250C745 250 740 345 815 345" fill="none" stroke="#007c87" stroke-width="13"/><path d="M870 130L870 390" fill="none" stroke="#ad334b" stroke-width="5" stroke-dasharray="10 8"/><text x="680" y="156" fill="#152c45" font-size="24" font-weight="500" text-anchor="middle"><tspan x="680" dy="0">Connector + cable</tspan></text><text x="848" y="422" fill="#ad334b" font-size="25" font-weight="500" text-anchor="end"><tspan x="848" dy="0">Panel boundary</tspan></text><text x="70" y="375" fill="#152c45" font-size="25" font-weight="500" text-anchor="start"><tspan x="70" dy="0">Do not force the panel against the cable</tspan></text><text x="45" y="488" fill="#47627e" font-size="19" font-weight="500" text-anchor="start"><tspan x="45" dy="0">Published dimensions</tspan></text></g></svg>
