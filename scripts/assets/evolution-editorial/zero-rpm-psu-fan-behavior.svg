<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc"><title id="title">Fan behavior needs its operating context</title><desc id="desc">Separate conceptual states distinguish expected stopped-fan behavior, expected running behavior and symptoms requiring support. Original schematic; not a manufacturer wiring diagram, product measurement or benchmark.</desc><rect width="960" height="520" rx="24" fill="#f6f9fe"/><g font-family="system-ui,Segoe UI,sans-serif"><text x="45" y="55" fill="#152c45" font-size="31" font-weight="750" text-anchor="start"><tspan x="45" dy="0">Fan behavior needs its operating context</tspan></text><circle cx="170" cy="220" r="64" fill="#edf4fd" stroke="#215edb" stroke-width="3"/><circle cx="170" cy="220" r="13" fill="#ffffff" stroke="#215edb" stroke-width="3"/><path d="M170 207C218 165 237 228 182 232Z" fill="#a9c0d9" transform="rotate(0 170 220)"/><path d="M170 207C218 165 237 228 182 232Z" fill="#a9c0d9" transform="rotate(90 170 220)"/><path d="M170 207C218 165 237 228 182 232Z" fill="#a9c0d9" transform="rotate(180 170 220)"/><path d="M170 207C218 165 237 228 182 232Z" fill="#a9c0d9" transform="rotate(270 170 220)"/><text x="170" y="326" fill="#152c45" font-size="26" font-weight="650" text-anchor="middle"><tspan x="170" dy="0">Stopped</tspan></text><circle cx="480" cy="220" r="64" fill="#edf4fd" stroke="#215edb" stroke-width="3"/><circle cx="480" cy="220" r="13" fill="#ffffff" stroke="#215edb" stroke-width="3"/><path d="M480 207C528 165 547 228 492 232Z" fill="#007c87" transform="rotate(0 480 220)"/><path d="M480 207C528 165 547 228 492 232Z" fill="#007c87" transform="rotate(90 480 220)"/><path d="M480 207C528 165 547 228 492 232Z" fill="#007c87" transform="rotate(180 480 220)"/><path d="M480 207C528 165 547 228 492 232Z" fill="#007c87" transform="rotate(270 480 220)"/><text x="480" y="326" fill="#152c45" font-size="26" font-weight="650" text-anchor="middle"><tspan x="480" dy="0">Running</tspan></text><circle cx="790" cy="220" r="64" fill="#edf4fd" stroke="#9c5405" stroke-width="3"/><text x="790" y="237" fill="#9c5405" font-size="55" font-weight="700" text-anchor="middle"><tspan x="790" dy="0">?</tspan></text><text x="790" y="326" fill="#152c45" font-size="26" font-weight="650" text-anchor="middle"><tspan x="790" dy="0">Check symptoms</tspan></text><text x="480" y="405" fill="#152c45" font-size="26" font-weight="500" text-anchor="middle"><tspan x="480" dy="0">Interpret with the exact PSU manual</tspan></text><text x="45" y="488" fill="#47627e" font-size="19" font-weight="500" text-anchor="start"><tspan x="45" dy="0">Not proof of failure</tspan></text></g></svg>
