<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc"><title id="title">Same total, different arrangement</title><desc id="desc">Three module arrangements show 48 GB and two different 96 GB totals without implying equal support or performance. Original schematic; not a manufacturer wiring diagram, product measurement or benchmark.</desc><rect width="960" height="520" rx="24" fill="#f6f9fe"/><g font-family="system-ui,Segoe UI,sans-serif"><text x="45" y="55" fill="#152c45" font-size="31" font-weight="750" text-anchor="start"><tspan x="45" dy="0">Same total, different arrangement</tspan></text><text x="50" y="164" fill="#152c45" font-size="24" font-weight="650" text-anchor="start"><tspan x="50" dy="0">2 × 24 GB = 48 GB</tspan></text><rect x="390" y="137" width="230.39999999999998" height="42" rx="9" fill="#215edb" stroke="#215edb" stroke-width="2"/><text x="50" y="253" fill="#152c45" font-size="24" font-weight="650" text-anchor="start"><tspan x="50" dy="0">2 × 48 GB = 96 GB</tspan></text><rect x="390" y="226" width="460.79999999999995" height="42" rx="9" fill="#215edb" stroke="#215edb" stroke-width="2"/><text x="50" y="342" fill="#152c45" font-size="24" font-weight="650" text-anchor="start"><tspan x="50" dy="0">4 × 24 GB = 96 GB</tspan></text><rect x="390" y="315" width="460.79999999999995" height="42" rx="9" fill="#edf4fd" stroke="#215edb" stroke-width="2"/><text x="480" y="423" fill="#152c45" font-size="26" font-weight="500" text-anchor="middle"><tspan x="480" dy="0">Same total ≠ same supported arrangement</tspan></text><text x="45" y="488" fill="#47627e" font-size="19" font-weight="500" text-anchor="start"><tspan x="45" dy="0">Capacity arithmetic only</tspan></text></g></svg>
