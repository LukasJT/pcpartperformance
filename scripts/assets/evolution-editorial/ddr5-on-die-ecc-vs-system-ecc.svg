<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc"><title id="title">The correction boundary matters</title><desc id="desc">A DRAM-chip boundary encloses on-die correction while the separate path to the CPU is labelled as requiring system-level ECC support. Original schematic; not a manufacturer wiring diagram, product measurement or benchmark.</desc><rect width="960" height="520" rx="24" fill="#f6f9fe"/><g font-family="system-ui,Segoe UI,sans-serif"><text x="45" y="55" fill="#152c45" font-size="31" font-weight="750" text-anchor="start"><tspan x="45" dy="0">The correction boundary matters</tspan></text><rect x="50" y="155" width="300" height="200" rx="16" fill="#edf4fd" stroke="#a9c0d9" stroke-width="2"/><text x="200" y="196" fill="#152c45" font-size="28" font-weight="700" text-anchor="middle"><tspan x="200" dy="0">DRAM chip</tspan></text><rect x="89" y="222" width="222" height="90" rx="16" fill="#ffffff" stroke="#007c87" stroke-width="2"/><text x="200" y="257" fill="#152c45" font-size="25" font-weight="650" text-anchor="middle"><tspan x="200" dy="0">On-die ECC</tspan></text><text x="200" y="291" fill="#152c45" font-size="19" font-weight="500" text-anchor="middle"><tspan x="200" dy="0">Inside this boundary</tspan></text><path d="M370 253L610 253" fill="none" stroke="#215edb" stroke-width="4"/><path d="M601 246L610 253L601 260" fill="none" stroke="#215edb" stroke-width="4"/><rect x="630" y="155" width="280" height="200" rx="16" fill="#ffffff" stroke="#a9c0d9" stroke-width="2"/><rect x="630" y="155" width="6" height="200" rx="3" fill="#215edb"/><text x="650" y="194" fill="#152c45" font-size="24" font-weight="650" text-anchor="start"><tspan x="650" dy="0">CPU + board</tspan></text><text x="650" y="325" fill="#47627e" font-size="19" font-weight="500" text-anchor="start"><tspan x="650" dy="0">System ECC support</tspan></text><text x="490" y="321" fill="#152c45" font-size="23" font-weight="500" text-anchor="middle"><tspan x="490" dy="0">External path</tspan></text><text x="480" y="415" fill="#152c45" font-size="25" font-weight="500" text-anchor="middle"><tspan x="480" dy="0">On-die ECC alone does not protect this whole path</tspan></text><text x="45" y="488" fill="#47627e" font-size="19" font-weight="500" text-anchor="start"><tspan x="45" dy="0">On-die ECC scope</tspan></text></g></svg>
