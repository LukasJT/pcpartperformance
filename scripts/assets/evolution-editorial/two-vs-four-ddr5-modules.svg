<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc"><title id="title">Four slots can still be two channels</title><desc id="desc">A conceptual four-DIMM board groups two slots under channel A and two under channel B; it does not specify a universal installation order. Original schematic; not a manufacturer wiring diagram, product measurement or benchmark.</desc><rect width="960" height="520" rx="24" fill="#f6f9fe"/><g font-family="system-ui,Segoe UI,sans-serif"><text x="45" y="55" fill="#152c45" font-size="31" font-weight="750" text-anchor="start"><tspan x="45" dy="0">Four slots can still be two channels</tspan></text><rect x="80" y="130" width="360" height="250" rx="16" fill="#edf4fd" stroke="#a9c0d9" stroke-width="2"/><text x="260" y="171" fill="#152c45" font-size="29" font-weight="700" text-anchor="middle"><tspan x="260" dy="0">Channel A</tspan></text><rect x="130" y="200" width="110" height="136" rx="16" fill="#ffffff" stroke="#a9c0d9" stroke-width="2"/><text x="185" y="276" fill="#152c45" font-size="30" font-weight="700" text-anchor="middle"><tspan x="185" dy="0">A1</tspan></text><path d="M141 316L227 316" fill="none" stroke="#007c87" stroke-width="7"/><rect x="280" y="200" width="110" height="136" rx="16" fill="#ffffff" stroke="#a9c0d9" stroke-width="2"/><text x="335" y="276" fill="#152c45" font-size="30" font-weight="700" text-anchor="middle"><tspan x="335" dy="0">A2</tspan></text><path d="M291 316L377 316" fill="none" stroke="#007c87" stroke-width="7"/><rect x="520" y="130" width="360" height="250" rx="16" fill="#edf4fd" stroke="#a9c0d9" stroke-width="2"/><text x="700" y="171" fill="#152c45" font-size="29" font-weight="700" text-anchor="middle"><tspan x="700" dy="0">Channel B</tspan></text><rect x="570" y="200" width="110" height="136" rx="16" fill="#ffffff" stroke="#a9c0d9" stroke-width="2"/><text x="625" y="276" fill="#152c45" font-size="30" font-weight="700" text-anchor="middle"><tspan x="625" dy="0">B1</tspan></text><path d="M581 316L667 316" fill="none" stroke="#007c87" stroke-width="7"/><rect x="720" y="200" width="110" height="136" rx="16" fill="#ffffff" stroke="#a9c0d9" stroke-width="2"/><text x="775" y="276" fill="#152c45" font-size="30" font-weight="700" text-anchor="middle"><tspan x="775" dy="0">B2</tspan></text><path d="M731 316L817 316" fill="none" stroke="#007c87" stroke-width="7"/><text x="480" y="418" fill="#152c45" font-size="25" font-weight="500" text-anchor="middle"><tspan x="480" dy="0">Conceptual grouping, not universal slot order</tspan></text><text x="45" y="488" fill="#47627e" font-size="19" font-weight="500" text-anchor="start"><tspan x="45" dy="0">Conceptual dual-channel layout</tspan></text></g></svg>
