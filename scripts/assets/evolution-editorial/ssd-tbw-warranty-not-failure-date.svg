<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc"><title id="title">Endurance, coverage and recovery are separate</title><desc id="desc">Separate records for observed writes, warranty conditions and backup recovery show why TBW is not a failure countdown. Original schematic; not a manufacturer wiring diagram, product measurement or benchmark.</desc><rect width="960" height="520" rx="24" fill="#f6f9fe"/><g font-family="system-ui,Segoe UI,sans-serif"><text x="45" y="55" fill="#152c45" font-size="31" font-weight="750" text-anchor="start"><tspan x="45" dy="0">Endurance, coverage and recovery are separate</tspan></text><rect x="48" y="126" width="864" height="79" rx="16" fill="#edf4fd" stroke="#a9c0d9" stroke-width="2"/><circle cx="77" cy="165.5" r="9" fill="#215edb"/><text x="102" y="173.5" fill="#152c45" font-size="24" font-weight="650" text-anchor="start"><tspan x="102" dy="0">Write counter</tspan></text><text x="904" y="172.5" fill="#47627e" font-size="21" font-weight="500" text-anchor="end"><tspan x="904" dy="0">Observed history</tspan></text><rect x="48" y="218" width="864" height="79" rx="16" fill="#ffffff" stroke="#a9c0d9" stroke-width="2"/><circle cx="77" cy="257.5" r="9" fill="#007c87"/><text x="102" y="265.5" fill="#152c45" font-size="24" font-weight="650" text-anchor="start"><tspan x="102" dy="0">Warranty terms</tspan></text><text x="904" y="264.5" fill="#47627e" font-size="21" font-weight="500" text-anchor="end"><tspan x="904" dy="0">Exact SKU conditions</tspan></text><rect x="48" y="310" width="864" height="79" rx="16" fill="#edf4fd" stroke="#a9c0d9" stroke-width="2"/><circle cx="77" cy="349.5" r="9" fill="#215edb"/><text x="102" y="357.5" fill="#152c45" font-size="24" font-weight="650" text-anchor="start"><tspan x="102" dy="0">Backup copy</tspan></text><text x="904" y="356.5" fill="#47627e" font-size="21" font-weight="500" text-anchor="end"><tspan x="904" dy="0">Recovery path</tspan></text><text x="45" y="488" fill="#47627e" font-size="19" font-weight="500" text-anchor="start"><tspan x="45" dy="0">Original schematic • Read the exact product instructions</tspan></text></g></svg>
