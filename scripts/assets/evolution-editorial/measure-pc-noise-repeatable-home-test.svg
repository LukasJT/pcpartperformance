<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc"><title id="title">Keep the measurement geometry fixed</title><desc id="desc">A home test plan fixes the microphone position relative to the PC and records background sound separately. Original schematic; not a manufacturer wiring diagram, product measurement or benchmark.</desc><rect width="960" height="520" rx="24" fill="#f6f9fe"/><g font-family="system-ui,Segoe UI,sans-serif"><text x="45" y="55" fill="#152c45" font-size="31" font-weight="750" text-anchor="start"><tspan x="45" dy="0">Keep the measurement geometry fixed</tspan></text><rect x="85" y="175" width="205" height="186" rx="16" fill="#edf4fd" stroke="#a9c0d9" stroke-width="2"/><text x="187" y="273" fill="#152c45" font-size="35" font-weight="700" text-anchor="middle"><tspan x="187" dy="0">PC</tspan></text><circle cx="695" cy="245" r="34" fill="#ffffff" stroke="#007c87" stroke-width="3"/><path d="M695 279L695 354" fill="none" stroke="#007c87" stroke-width="5"/><path d="M654 354L736 354" fill="none" stroke="#007c87" stroke-width="5"/><path d="M315 310L640 310" fill="none" stroke="#215edb" stroke-width="3" stroke-dasharray="8 6"/><text x="480" y="290" fill="#152c45" font-size="26" font-weight="500" text-anchor="middle"><tspan x="480" dy="0">Fixed position</tspan></text><text x="695" y="155" fill="#152c45" font-size="26" font-weight="500" text-anchor="middle"><tspan x="695" dy="0">Microphone</tspan></text><text x="480" y="423" fill="#152c45" font-size="26" font-weight="500" text-anchor="middle"><tspan x="480" dy="0">Record the room before comparing the PC</tspan></text><text x="45" y="488" fill="#47627e" font-size="19" font-weight="500" text-anchor="start"><tspan x="45" dy="0">Same workload and fan settings</tspan></text></g></svg>
