<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc"><title id="title">Four functions, one documented map</title><desc id="desc">Four labelled function groups distinguish case switches from power and drive indicators without specifying universal pin positions. Original schematic; not a manufacturer wiring diagram, product measurement or benchmark.</desc><rect width="960" height="520" rx="24" fill="#f6f9fe"/><g font-family="system-ui,Segoe UI,sans-serif"><text x="45" y="55" fill="#152c45" font-size="31" font-weight="750" text-anchor="start"><tspan x="45" dy="0">Four functions, one documented map</tspan></text><rect x="55" y="130" width="390" height="118" rx="16" fill="#ffffff" stroke="#a9c0d9" stroke-width="2"/><rect x="55" y="130" width="6" height="118" rx="3" fill="#215edb"/><text x="75" y="169" fill="#152c45" font-size="24" font-weight="650" text-anchor="start"><tspan x="75" dy="0">Power switch</tspan></text><text x="75" y="218" fill="#47627e" font-size="19" font-weight="500" text-anchor="start"><tspan x="75" dy="0">Control</tspan></text><circle cx="397" cy="187" r="18" fill="#edf4fd" stroke="#215edb" stroke-width="3"/><rect x="515" y="130" width="390" height="118" rx="16" fill="#ffffff" stroke="#a9c0d9" stroke-width="2"/><rect x="515" y="130" width="6" height="118" rx="3" fill="#215edb"/><text x="535" y="169" fill="#152c45" font-size="24" font-weight="650" text-anchor="start"><tspan x="535" dy="0">Reset switch</tspan></text><text x="535" y="218" fill="#47627e" font-size="19" font-weight="500" text-anchor="start"><tspan x="535" dy="0">Control</tspan></text><circle cx="857" cy="187" r="18" fill="#edf4fd" stroke="#215edb" stroke-width="3"/><rect x="55" y="280" width="390" height="118" rx="16" fill="#ffffff" stroke="#a9c0d9" stroke-width="2"/><rect x="55" y="280" width="6" height="118" rx="3" fill="#215edb"/><text x="75" y="319" fill="#152c45" font-size="24" font-weight="650" text-anchor="start"><tspan x="75" dy="0">Power LED</tspan></text><text x="75" y="368" fill="#47627e" font-size="19" font-weight="500" text-anchor="start"><tspan x="75" dy="0">Indicator</tspan></text><circle cx="397" cy="337" r="18" fill="#edf4fd" stroke="#007c87" stroke-width="3"/><rect x="515" y="280" width="390" height="118" rx="16" fill="#ffffff" stroke="#a9c0d9" stroke-width="2"/><rect x="515" y="280" width="6" height="118" rx="3" fill="#215edb"/><text x="535" y="319" fill="#152c45" font-size="24" font-weight="650" text-anchor="start"><tspan x="535" dy="0">Drive LED</tspan></text><text x="535" y="368" fill="#47627e" font-size="19" font-weight="500" text-anchor="start"><tspan x="535" dy="0">Indicator</tspan></text><circle cx="857" cy="337" r="18" fill="#edf4fd" stroke="#007c87" stroke-width="3"/><text x="45" y="488" fill="#47627e" font-size="19" font-weight="500" text-anchor="start"><tspan x="45" dy="0">Original schematic • Read the exact product instructions</tspan></text></g></svg>
