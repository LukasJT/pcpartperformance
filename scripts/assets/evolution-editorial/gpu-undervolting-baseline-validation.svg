<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc"><title id="title">A reversible tuning experiment</title><desc id="desc">A reversible experiment flows from saved stock settings through one supported change and validation to keeping or resetting it. Original schematic; not a manufacturer wiring diagram, product measurement or benchmark.</desc><rect width="960" height="520" rx="24" fill="#f6f9fe"/><g font-family="system-ui,Segoe UI,sans-serif"><text x="45" y="55" fill="#152c45" font-size="31" font-weight="750" text-anchor="start"><tspan x="45" dy="0">A reversible tuning experiment</tspan></text><rect x="55" y="132" width="390" height="124" rx="16" fill="#ffffff" stroke="#a9c0d9" stroke-width="2"/><rect x="55" y="132" width="6" height="124" rx="3" fill="#215edb"/><text x="75" y="171" fill="#152c45" font-size="24" font-weight="650" text-anchor="start"><tspan x="75" dy="0">Stock baseline</tspan></text><text x="75" y="226" fill="#47627e" font-size="19" font-weight="500" text-anchor="start"><tspan x="75" dy="0">Save original settings</tspan></text><path d="M455 188L505 188" fill="none" stroke="#215edb" stroke-width="4"/><path d="M496 181L505 188L496 195" fill="none" stroke="#215edb" stroke-width="4"/><rect x="515" y="132" width="390" height="124" rx="16" fill="#ffffff" stroke="#a9c0d9" stroke-width="2"/><rect x="515" y="132" width="6" height="124" rx="3" fill="#215edb"/><text x="535" y="171" fill="#152c45" font-size="24" font-weight="650" text-anchor="start"><tspan x="535" dy="0">Supported change</tspan></text><text x="535" y="226" fill="#47627e" font-size="19" font-weight="500" text-anchor="start"><tspan x="535" dy="0">One variable at a time</tspan></text><rect x="55" y="282" width="390" height="124" rx="16" fill="#ffffff" stroke="#a9c0d9" stroke-width="2"/><rect x="55" y="282" width="6" height="124" rx="3" fill="#215edb"/><text x="75" y="321" fill="#152c45" font-size="24" font-weight="650" text-anchor="start"><tspan x="75" dy="0">Workload checks</tspan></text><text x="75" y="376" fill="#47627e" font-size="19" font-weight="500" text-anchor="start"><tspan x="75" dy="0">Record failures too</tspan></text><path d="M455 338L505 338" fill="none" stroke="#215edb" stroke-width="4"/><path d="M496 331L505 338L496 345" fill="none" stroke="#215edb" stroke-width="4"/><rect x="515" y="282" width="390" height="124" rx="16" fill="#ffffff" stroke="#a9c0d9" stroke-width="2"/><rect x="515" y="282" width="6" height="124" rx="3" fill="#215edb"/><text x="535" y="321" fill="#152c45" font-size="24" font-weight="650" text-anchor="start"><tspan x="535" dy="0">Keep or reset</tspan></text><text x="535" y="376" fill="#47627e" font-size="19" font-weight="500" text-anchor="start"><tspan x="535" dy="0">No universal offset</tspan></text><text x="45" y="488" fill="#47627e" font-size="19" font-weight="500" text-anchor="start"><tspan x="45" dy="0">Original schematic • Read the exact product instructions</tspan></text></g></svg>
