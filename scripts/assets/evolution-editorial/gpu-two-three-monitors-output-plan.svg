<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc"><title id="title">One documented path per screen</title><desc id="desc">One graphics card connects to three individually labelled monitors, each requiring its own supported cable and mode. Original schematic; not a manufacturer wiring diagram, product measurement or benchmark.</desc><rect width="960" height="520" rx="24" fill="#f6f9fe"/><g font-family="system-ui,Segoe UI,sans-serif"><text x="45" y="55" fill="#152c45" font-size="31" font-weight="750" text-anchor="start"><tspan x="45" dy="0">One documented path per screen</tspan></text><rect x="55" y="219" width="220" height="106" rx="16" fill="#ffffff" stroke="#a9c0d9" stroke-width="2"/><rect x="55" y="219" width="6" height="106" rx="3" fill="#215edb"/><text x="75" y="258" fill="#152c45" font-size="24" font-weight="650" text-anchor="start"><tspan x="75" dy="0">GPU</tspan></text><text x="75" y="295" fill="#47627e" font-size="19" font-weight="500" text-anchor="start"><tspan x="75" dy="0">Exact output list</tspan></text><rect x="430" y="151" width="135" height="82" rx="16" fill="#edf4fd" stroke="#a9c0d9" stroke-width="2"/><text x="497" y="181" fill="#152c45" font-size="22" font-weight="500" text-anchor="middle"><tspan x="497" dy="0">Display A</tspan></text><path d="M497 234L497 255" fill="none" stroke="#47627e" stroke-width="3"/><path d="M465 255L530 255" fill="none" stroke="#47627e" stroke-width="3"/><path d="M285 268L340 268L340 192L430 192" fill="none" stroke="#215edb" stroke-width="3"/><rect x="590" y="204" width="135" height="82" rx="16" fill="#edf4fd" stroke="#a9c0d9" stroke-width="2"/><text x="657" y="234" fill="#152c45" font-size="22" font-weight="500" text-anchor="middle"><tspan x="657" dy="0">Display B</tspan></text><path d="M657 287L657 308" fill="none" stroke="#47627e" stroke-width="3"/><path d="M625 308L690 308" fill="none" stroke="#47627e" stroke-width="3"/><path d="M285 268L340 268L340 245L590 245" fill="none" stroke="#007c87" stroke-width="3"/><rect x="750" y="257" width="135" height="82" rx="16" fill="#edf4fd" stroke="#a9c0d9" stroke-width="2"/><text x="817" y="287" fill="#152c45" font-size="22" font-weight="500" text-anchor="middle"><tspan x="817" dy="0">Display C</tspan></text><path d="M817 340L817 361" fill="none" stroke="#47627e" stroke-width="3"/><path d="M785 361L850 361" fill="none" stroke="#47627e" stroke-width="3"/><path d="M285 268L340 268L340 298L750 298" fill="none" stroke="#215edb" stroke-width="3"/><text x="480" y="424" fill="#152c45" font-size="25" font-weight="500" text-anchor="middle"><tspan x="480" dy="0">Verify the combination, not just individual ports</tspan></text><text x="45" y="488" fill="#47627e" font-size="19" font-weight="500" text-anchor="start"><tspan x="45" dy="0">Check combined support</tspan></text></g></svg>
