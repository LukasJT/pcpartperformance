name: Daily supported retailer prices

on:
  schedule:
    - cron: '17 7 * * *'
      timezone: America/Toronto
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/daily-public-prices.yml]

permissions:
  contents: read

concurrency:
  group: daily-public-prices
  cancel-in-progress: false

env:
  PRODUCTION_BRANCH: codex/stage2-publication-2026-10-04

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out reviewed production source without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: codex/stage2-publication-2026-10-04
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Validate parsers, history, operation boundaries and publication rules
        run: |
          node scripts/oct14-price-sources.test.mjs
          node scripts/oct14-price-sources-newegg.test.mjs
          node scripts/public-price-snapshot.test.mjs
          node scripts/completion-price-history.test.mjs
          node scripts/completion-price-expansion.test.mjs
          node scripts/public-price-expansion-integration.test.mjs
          node --test scripts/total-operations.test.mjs
      - name: Collect registered prices and inspect fixed primary-source indexes
        id: collect
        run: node scripts/total-operations.mjs --online --collect-prices --ci-output
      - name: Preserve the report and unpublished review proposals
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: daily-operations-${{ github.run_id }}
          path: .operations-run/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Write the run summary
        if: always()
        run: |
          if test -f .operations-run/SUMMARY.md; then cat .operations-run/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"; fi

  # The network job above has no write token. This job accepts only normalized
  # fixed JSON files from this same run; no untrusted artifact is executable.
  publish-data:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out the latest production branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: codex/stage2-publication-2026-10-04
          fetch-depth: 1
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Download only this run's fixed data artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: daily-operations-${{ github.run_id }}
          path: .operations-artifact/
      - name: Revalidate and normalize all artifact data before staging
        run: node scripts/total-operations-publish.mjs
      - name: Publish observations and review-only operational metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/public-price-snapshot.json data/public-price-history.json data/operations-source-state.json data/operations-review-queue.json data/operations-status.json
          if git diff --cached --quiet; then exit 0; fi
          git diff --cached --name-only | while IFS= read -r changed; do
            case "$changed" in
              data/public-price-snapshot.json|data/public-price-history.json|data/operations-source-state.json|data/operations-review-queue.json|data/operations-status.json) ;;
              *) echo 'Refusing a file outside the fixed data publication set.'; exit 1 ;;
            esac
          done
          git commit -m 'Refresh dated prices and unpublished maintenance leads'
          git push origin "HEAD:refs/heads/$PRODUCTION_BRANCH"
      - name: Surface source failures without suppressing a valid freshness update
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const run=JSON.parse(fs.readFileSync('data/operations-status.json','utf8')); console.log(JSON.stringify(run)); if(run.status!=='completed')process.exitCode=1;"
