<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#101a28"/><path d="M64 58h1072" stroke="#45617e"/><text x="64" y="102" fill="#9bb9dd" font-family="Arial" font-size="24">PC PART PERFORMANCE · DECISION GUIDE</text><text x="64" y="166" fill="#f0f5fd" font-family="Arial" font-weight="700" font-size="38">A new PC has no display: read debug LEDs without</text><text x="64" y="214" fill="#f0f5fd" font-family="Arial" font-weight="700" font-size="38">guessing the faulty part</text><path d="M240 395h730" stroke="#81aff0" stroke-width="3"/><rect x="64" y="326" width="340" height="224" rx="16" fill="#1c2c41" stroke="#45617e"/><circle cx="100" cy="367" r="18" fill="#81aff0"/><text x="94" y="373" fill="#101a28" font-family="Arial" font-size="19" font-weight="700">1</text><text x="90" y="418" fill="#edf4ff" font-family="Arial" font-size="22">Record the failure before</text><text x="90" y="446" fill="#edf4ff" font-family="Arial" font-size="22">touching the build</text><rect x="430" y="326" width="340" height="224" rx="16" fill="#1c2c41" stroke="#45617e"/><circle cx="466" cy="367" r="18" fill="#81aff0"/><text x="460" y="373" fill="#101a28" font-family="Arial" font-size="19" font-weight="700">2</text><text x="456" y="418" fill="#edf4ff" font-family="Arial" font-size="22">Prove the external display</text><text x="456" y="446" fill="#edf4ff" font-family="Arial" font-size="22">path first</text><rect x="796" y="326" width="340" height="224" rx="16" fill="#1c2c41" stroke="#45617e"/><circle cx="832" cy="367" r="18" fill="#81aff0"/><text x="826" y="373" fill="#101a28" font-family="Arial" font-size="19" font-weight="700">3</text><text x="822" y="418" fill="#edf4ff" font-family="Arial" font-size="22">Turn a persistent LED into</text><text x="822" y="446" fill="#edf4ff" font-family="Arial" font-size="22">the next question</text><text x="64" y="617" fill="#b8cbe3" font-family="Arial" font-size="22">Read the exact evidence. Compare the complete plan. Verify the unknowns.</text></svg>